name: Refresh jobs and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch current jobs and build site
        run: python -m job_scout.build_static
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Record successful refresh heartbeat
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          path = Path(".github/job-scout-last-refresh")
          now = datetime.now(timezone.utc)
          try:
              previous = datetime.fromisoformat(path.read_text().strip().replace("Z", "+00:00"))
          except (OSError, ValueError):
              previous = now - timedelta(days=31)
          if now - previous >= timedelta(days=30):
              path.write_text(now.isoformat(timespec="seconds").replace("+00:00", "Z") + "\n")
          PY
          if ! git diff --quiet -- .github/job-scout-last-refresh; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/job-scout-last-refresh
            git commit -m "chore: record refresh heartbeat [skip ci]"
            git push
          fi
